# Contanika - nginx delante de gunicorn. Plantilla: instalar_vps.sh reemplaza
# __DOMINIO__ y __PUERTO__; certbot agrega después el bloque HTTPS y la
# redirección de http a https.

# Quien entre por la IP o con otro nombre no recibe respuesta (robots que
# recorren direcciones al azar).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    server_tokens off;
    # Los adjuntos admiten hasta 10 MB (comunes/formularios.py).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_set_header Host $host;
        # Se REEMPLAZA (no se agrega) la cabecera: así nadie puede inventarse
        # otra IP y saltarse el bloqueo por intentos fallidos.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
