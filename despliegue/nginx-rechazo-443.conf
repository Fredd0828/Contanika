# Contanika - nginx: por HTTPS, quien no pide el dominio del sistema no recibe
# respuesta. Lo instalan instalar_vps.sh y actualizar.sh en
# /etc/nginx/conf.d/contanika-rechazo-443.conf.
#
# Robots que recorren direcciones al azar llegan por la IP, por la IPv6 o con
# nombres ajenos. Por HTTP ya los corta el bloque `return 444` de
# nginx-contanika.conf; por HTTPS llegaban a Django, que los rechazaba con 400
# (DisallowedHost) y llenaban el registro de la aplicación.
#
# ssl_reject_handshake corta la conexión TLS sin necesitar un certificado
# (nginx 1.19.4 o superior; Ubuntu 24.04 trae 1.24).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
