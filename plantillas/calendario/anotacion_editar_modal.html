<div class="modal-header">
    <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Editar anotación</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>
<form method="post" action="{% url 'calendario:editar_anotacion' anotacion.pk %}">
    <div class="modal-body">
        {% include "calendario/_anotacion_campos.html" %}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-cargar-en-modal="{% url 'calendario:detalle_anotacion' anotacion.pk %}">Volver</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Guardar cambios</button>
    </div>
</form>
